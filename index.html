<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calendar ✨</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            font-family: 'Quicksand', sans-serif; 
        }
        /* Hide Tailwind warning */
        #tailwind-cdn-warning { display: none !important; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Lucide icons as SVG components
        const ChevronLeft = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        );
        const ChevronRight = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        );
        const Plus = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );
        const X = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        );
        const Bell = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
        );
        const Settings = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 1v6m0 6v6m5.66-15.66l-4.24 4.24m0 6l-4.24 4.24m12.02-.02l-4.24-4.24m0-6l-4.24-4.24"></path>
            </svg>
        );
        const Filter = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>
        );

        // Simple localStorage wrapper
        const storage = {
            get: (key) => {
                try {
                    const value = localStorage.getItem(key);
                    return value ? { value } : null;
                } catch {
                    return null;
                }
            },
            set: (key, value) => {
                try {
                    localStorage.setItem(key, value);
                } catch (e) {
                    console.log('Storage error:', e);
                }
            }
        };

        const StudentCalendar = () => {
          const [currentDate, setCurrentDate] = useState(new Date());
          const [view, setView] = useState('month');
          const [events, setEvents] = useState([]);
          const [showEventModal, setShowEventModal] = useState(false);
          const [showSettingsModal, setShowSettingsModal] = useState(false);
          const [showCategoriesModal, setShowCategoriesModal] = useState(false);
          const [selectedDate, setSelectedDate] = useState(null);
          const [accentColor, setAccentColor] = useState('#FFB6C1');
          const [editingEvent, setEditingEvent] = useState(null);
          const [alerts, setAlerts] = useState([]);
          const [wallpaper, setWallpaper] = useState({ pattern: 'none', color: '#FFB6C1' });
          
          const [categories, setCategories] = useState([
            { id: 'soccer', name: 'Soccer', color: '#FF69B4', emoji: '⚽', visible: true },
            { id: 'school', name: 'School', color: '#9B59B6', emoji: '📚', visible: true },
            { id: 'work', name: 'Work', color: '#3498DB', emoji: '💼', visible: true },
            { id: 'social', name: 'Social', color: '#E67E22', emoji: '❤️', visible: true },
            { id: 'volunteer', name: 'Volunteering', color: '#2ECC71', emoji: '🤝', visible: true },
            { id: 'personal', name: 'Personal', color: '#F39C12', emoji: '✨', visible: true }
          ]);
          
          const [eventForm, setEventForm] = useState({
            title: '', date: '', time: '', duration: 60, emoji: '📅',
            category: 'personal', notes: '', alertMinutes: 15,
            repeat: 'none', repeatUntil: '', allDay: false
          });

          const colorThemes = {
            pastel: [
              { name: 'Soft Pink', value: '#FFB6C1' }, { name: 'Lavender', value: '#E6B5E8' },
              { name: 'Peach', value: '#FFDAB9' }, { name: 'Mint', value: '#B5EAD7' },
              { name: 'Sky Blue', value: '#B8E6F5' }, { name: 'Lemon', value: '#FFF4B8' }
            ],
            vibrant: [
              { name: 'Hot Pink', value: '#FF1493' }, { name: 'Purple', value: '#9B59B6' },
              { name: 'Coral', value: '#FF6B6B' }, { name: 'Turquoise', value: '#1ABC9C' },
              { name: 'Royal Blue', value: '#3498DB' }, { name: 'Sunshine', value: '#F1C40F' }
            ]
          };

          const [colorMode, setColorMode] = useState('pastel');

          const emojiCategories = {
            'Sports': ['⚽', '🏀', '🏈', '⚾', '🎾', '🏐', '🏊', '🏃', '🚴', '⛷️'],
            'Work': ['💼', '💻', '📊', '📈', '🏢', '👔', '📝', '✏️', '📚', '🎯'],
            'Social': ['❤️', '🎉', '🎊', '🍕', '☕', '🎮', '🎬', '🎵', '👥', '💬'],
            'Study': ['📖', '✍️', '🎓', '📚', '🧮', '🔬', '📐', '💡', '🧠', '🌟'],
            'Fun': ['✨', '🌸', '🌺', '🦋', '🌈', '💫', '🎀', '💝', '🍰', '🧁']
          };

          useEffect(() => {
            const loadData = () => {
              try {
                const eventsData = storage.get('calendar-events');
                const colorData = storage.get('calendar-accent-color');
                const categoriesData = storage.get('calendar-categories');
                const colorModeData = storage.get('calendar-color-mode');
                const wallpaperData = storage.get('calendar-wallpaper');
                
                if (eventsData?.value) setEvents(JSON.parse(eventsData.value));
                if (colorData?.value) setAccentColor(colorData.value);
                if (categoriesData?.value) setCategories(JSON.parse(categoriesData.value));
                if (colorModeData?.value) setColorMode(colorModeData.value);
                if (wallpaperData?.value) setWallpaper(JSON.parse(wallpaperData.value));
              } catch (error) {
                console.log('No saved data');
              }
            };
            loadData();
          }, []);

          useEffect(() => { storage.set('calendar-events', JSON.stringify(events)); }, [events]);
          useEffect(() => { storage.set('calendar-accent-color', accentColor); }, [accentColor]);
          useEffect(() => { storage.set('calendar-categories', JSON.stringify(categories)); }, [categories]);
          useEffect(() => { storage.set('calendar-color-mode', colorMode); }, [colorMode]);
          useEffect(() => { storage.set('calendar-wallpaper', JSON.stringify(wallpaper)); }, [wallpaper]);

          const getBackgroundPattern = () => {
            if (wallpaper.pattern === 'none') return {};
            const patterns = {
              polkadots: {
                backgroundImage: `radial-gradient(circle, ${wallpaper.color}15 1.5px, transparent 1.5px)`,
                backgroundSize: '20px 20px'
              },
              stripes: {
                backgroundImage: `repeating-linear-gradient(45deg, ${wallpaper.color}08, ${wallpaper.color}08 10px, transparent 10px, transparent 20px)`,
                backgroundSize: '40px 40px'
              },
              hearts: {
                backgroundImage: `url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 30c-1-1-8-7-8-13 0-3 2-5 5-5 2 0 3 1 3 1s1-1 3-1c3 0 5 2 5 5 0 6-7 12-8 13z' fill='${wallpaper.color.replace('#', '%23')}' opacity='0.08'/%3E%3C/svg%3E")`,
                backgroundSize: '40px 40px'
              }
            };
            return patterns[wallpaper.pattern] || {};
          };

          const getDaysInMonth = (date) => {
            const year = date.getFullYear();
            const month = date.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            return { daysInMonth: lastDay.getDate(), startingDayOfWeek: firstDay.getDay() };
          };

          const generateRecurringEvents = (baseEvent) => {
            if (baseEvent.repeat === 'none' || !baseEvent.repeatUntil) return [baseEvent];
            const events = [];
            const startDate = new Date(baseEvent.date);
            const endDate = new Date(baseEvent.repeatUntil);
            let currentDate = new Date(startDate);

            while (currentDate <= endDate) {
              events.push({
                ...baseEvent,
                date: currentDate.toISOString().split('T')[0],
                id: `${baseEvent.id}-${currentDate.toISOString().split('T')[0]}`
              });

              switch (baseEvent.repeat) {
                case 'daily': currentDate.setDate(currentDate.getDate() + 1); break;
                case 'weekly': currentDate.setDate(currentDate.getDate() + 7); break;
                case 'biweekly': currentDate.setDate(currentDate.getDate() + 14); break;
                case 'monthly': currentDate.setMonth(currentDate.getMonth() + 1); break;
                default: currentDate = new Date(endDate.getTime() + 1);
              }
            }
            return events;
          };

          const handleAddEvent = () => {
            const category = categories.find(c => c.id === eventForm.category);
            const newEvent = {
              ...eventForm,
              color: category?.color || accentColor,
              id: editingEvent?.id || Date.now().toString()
            };

            if (editingEvent) {
              setEvents(events.map(e => e.id === editingEvent.id ? newEvent : e));
            } else {
              const recurringEvents = generateRecurringEvents(newEvent);
              setEvents([...events, ...recurringEvents]);
            }
            setShowEventModal(false);
            resetForm();
          };

          const resetForm = () => {
            setEventForm({
              title: '', date: '', time: '', duration: 60, emoji: '📅',
              category: 'personal', notes: '', alertMinutes: 15,
              repeat: 'none', repeatUntil: '', allDay: false
            });
            setEditingEvent(null);
          };

          const handleEditEvent = (event) => {
            setEditingEvent(event);
            setEventForm(event);
            setShowEventModal(true);
          };

          const handleDeleteEvent = (eventId) => {
            setEvents(events.filter(e => e.id !== eventId));
            setShowEventModal(false);
            resetForm();
          };

          const toggleCategory = (categoryId) => {
            setCategories(categories.map(c => 
              c.id === categoryId ? { ...c, visible: !c.visible } : c
            ));
          };

          const getVisibleEvents = (date) => {
            return events.filter(e => {
              const category = categories.find(c => c.id === e.category);
              return e.date === date && category?.visible !== false;
            });
          };

          const getCurrentWeek = () => {
            const start = new Date(currentDate);
            start.setDate(start.getDate() - start.getDay());
            const week = [];
            for (let i = 0; i < 7; i++) {
              const day = new Date(start);
              day.setDate(start.getDate() + i);
              week.push(day);
            }
            return week;
          };

          const renderWeekStrip = () => {
            const week = getCurrentWeek();
            const today = new Date();
            
            return (
              <div className="flex gap-1.5 mb-3 overflow-x-auto pb-2">
                {week.map((day, idx) => {
                  const dateStr = day.toISOString().split('T')[0];
                  const dayEvents = getVisibleEvents(dateStr);
                  const isToday = day.toDateString() === today.toDateString();
                  
                  return (
                    <div key={idx} className="flex-shrink-0 w-12 text-center cursor-pointer hover:bg-gray-50 rounded-lg p-1.5 transition-all"
                      onClick={() => {
                        setSelectedDate(dateStr);
                        setEventForm({ ...eventForm, date: dateStr });
                        setShowEventModal(true);
                      }}>
                      <div className="text-xs text-gray-500 mb-0.5">
                        {day.toLocaleDateString('en-US', { weekday: 'short' }).slice(0, 1)}
                      </div>
                      <div className={`text-sm font-bold rounded-full w-7 h-7 mx-auto flex items-center justify-center ${isToday ? 'text-white shadow-md' : ''}`}
                        style={isToday ? { background: `linear-gradient(135deg, ${accentColor} 0%, ${accentColor}dd 100%)` } : {}}>
                        {day.getDate()}
                      </div>
                      <div className="flex gap-0.5 justify-center mt-0.5">
                        {dayEvents.slice(0, 3).map((e, i) => (
                          <div key={i} className="w-1 h-1 rounded-full" style={{ backgroundColor: e.color }} />
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            );
          };

          const renderMonthView = () => {
            const { daysInMonth, startingDayOfWeek } = getDaysInMonth(currentDate);
            const days = [];
            const monthYear = currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            for (let i = 0; i < startingDayOfWeek; i++) {
              days.push(<div key={`empty-${i}`} className="p-1.5 border border-gray-50"></div>);
            }

            for (let day = 1; day <= daysInMonth; day++) {
              const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
              const dayEvents = getVisibleEvents(dateStr);
              const isToday = new Date().toDateString() === new Date(dateStr).toDateString();

              days.push(
                <div key={day} className={`p-1.5 border border-gray-50 min-h-20 cursor-pointer hover:bg-gray-50 transition-all rounded-lg ${isToday ? 'ring-2' : ''}`}
                  style={isToday ? { ringColor: accentColor } : {}}
                  onClick={() => {
                    setSelectedDate(dateStr);
                    setEventForm({ ...eventForm, date: dateStr });
                    setShowEventModal(true);
                  }}>
                  <div className={`text-xs font-bold mb-1 ${isToday ? 'text-white rounded-full w-5 h-5 flex items-center justify-center shadow-md' : ''}`}
                    style={isToday ? { background: `linear-gradient(135deg, ${accentColor} 0%, ${accentColor}dd 100%)`, fontSize: '10px' } : {}}>
                    {day}
                  </div>
                  <div className="space-y-0.5">
                    {dayEvents.slice(0, 2).map(event => (
                      <div key={event.id} className="text-xs px-1.5 py-0.5 rounded-full truncate cursor-pointer hover:shadow-sm transition-all font-medium"
                        style={{ backgroundColor: event.color + '25', color: event.color, borderLeft: `2px solid ${event.color}`, fontSize: '10px' }}
                        onClick={(e) => { e.stopPropagation(); handleEditEvent(event); }}>
                        <span className="mr-0.5">{event.emoji}</span>
                        {!event.allDay && `${event.time} `}{event.title}
                      </div>
                    ))}
                    {dayEvents.length > 2 && (
                      <div className="text-xs text-gray-400 pl-1.5 font-medium" style={{ fontSize: '10px' }}>+{dayEvents.length - 2}</div>
                    )}
                  </div>
                </div>
              );
            }

            return (
              <div>
                <div className="text-center text-xl font-bold mb-3" style={{ color: accentColor }}>{monthYear}</div>
                <div className="grid grid-cols-7 gap-0 border border-gray-100 rounded-xl overflow-hidden shadow-sm">
                  {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (
                    <div key={day} className="p-2 font-bold text-center bg-gradient-to-b from-gray-50 to-white border-b border-gray-100 text-gray-600 text-xs">{day}</div>
                  ))}
                  {days}
                </div>
              </div>
            );
          };

          return (
            <div className="min-h-screen bg-white p-3 text-xs" style={{ fontFamily: 'Quicksand, sans-serif', ...getBackgroundPattern() }}>
              <div className="fixed top-6 right-6 text-3xl opacity-15 pointer-events-none">✨</div>
              <div className="fixed bottom-12 left-6 text-2xl opacity-15 pointer-events-none">🌸</div>

              <div className="max-w-6xl mx-auto mb-3">
                <div className="flex justify-between items-center mb-3">
                  <h1 className="text-xl font-bold bg-gradient-to-r from-pink-500 via-purple-500 to-pink-500 bg-clip-text text-transparent">✨ My Calendar</h1>
                  <div className="flex gap-1.5">
                    <button onClick={() => setShowCategoriesModal(true)} className="p-1.5 rounded-lg hover:bg-white/50 transition-all shadow-sm" style={{ color: accentColor }}>
                      <Filter size={16} />
                    </button>
                    <button onClick={() => setShowSettingsModal(true)} className="p-1.5 rounded-lg hover:bg-white/50 transition-all shadow-sm" style={{ color: accentColor }}>
                      <Settings size={16} />
                    </button>
                    <button onClick={() => {
                      setSelectedDate(new Date().toISOString().split('T')[0]);
                      setEventForm({ ...eventForm, date: new Date().toISOString().split('T')[0] });
                      setShowEventModal(true);
                    }} className="px-3 py-1.5 rounded-lg text-white text-xs font-bold flex items-center gap-1.5 hover:shadow-lg transition-all"
                      style={{ background: `linear-gradient(135deg, ${accentColor} 0%, ${accentColor}dd 100%)` }}>
                      <Plus size={14} /> Add Event
                    </button>
                  </div>
                </div>

                {renderWeekStrip()}

                <div className="flex justify-between items-center mb-3">
                  <div className="flex gap-1.5">
                    <button onClick={() => setView('month')} className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${view === 'month' ? 'text-white shadow-md' : 'bg-white/50'}`}
                      style={view === 'month' ? { background: `linear-gradient(135deg, ${accentColor} 0%, ${accentColor}dd 100%)` } : {}}>Month</button>
                  </div>

                  <div className="flex items-center gap-1.5">
                    <button onClick={() => setCurrentDate(new Date(currentDate.setMonth(currentDate.getMonth() - 1)))} className="p-1 rounded-lg hover:bg-white/50 transition-all">
                      <ChevronLeft size={16} />
                    </button>
                    <button onClick={() => setCurrentDate(new Date())} className="px-3 py-1 rounded-lg hover:bg-white/50 transition-all text-xs font-bold">Today</button>
                    <button onClick={() => setCurrentDate(new Date(currentDate.setMonth(currentDate.getMonth() + 1)))} className="p-1 rounded-lg hover:bg-white/50 transition-all">
                      <ChevronRight size={16} />
                    </button>
                  </div>
                </div>
              </div>

              <div className="max-w-6xl mx-auto">{renderMonthView()}</div>

              {showEventModal && (
                <div className="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-40 p-4" style={{ backdropFilter: 'blur(4px)' }}>
                  <div className="bg-white rounded-xl p-5 w-full max-w-2xl shadow-2xl" style={{ maxHeight: '85vh', display: 'flex', flexDirection: 'column' }}>
                    <div className="flex justify-between items-center mb-4">
                      <h2 className="text-xl font-bold" style={{ color: accentColor }}>{editingEvent ? 'Edit Event' : 'New Event'}</h2>
                      <button onClick={() => { setShowEventModal(false); resetForm(); }} className="text-gray-400 hover:text-gray-600">
                        <X size={20} />
                      </button>
                    </div>

                    <div className="overflow-y-auto flex-1 pr-2" style={{ scrollbarWidth: 'thin' }}>
                      <div className="space-y-3">
                        <div>
                          <label className="block text-xs font-bold mb-2" style={{ color: accentColor }}>Category</label>
                          <div className="grid grid-cols-3 gap-2">
                            {categories.map(cat => (
                              <button key={cat.id} onClick={() => setEventForm({ ...eventForm, category: cat.id })}
                                className={`p-2 rounded-lg border-2 transition-all ${eventForm.category === cat.id ? 'shadow-md' : 'border-gray-200'}`}
                                style={eventForm.category === cat.id ? { borderColor: cat.color, backgroundColor: cat.color + '10' } : {}}>
                                <div className="text-xl mb-0.5">{cat.emoji}</div>
                                <div className="text-xs font-bold">{cat.name}</div>
                              </button>
                            ))}
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-bold mb-2" style={{ color: accentColor }}>Icon</label>
                          <div className="space-y-2 max-h-48 overflow-y-auto border border-gray-100 rounded-lg p-2">
                            {Object.entries(emojiCategories).map(([category, emojis]) => (
                              <div key={category}>
                                <div className="text-xs text-gray-500 mb-1 font-semibold">{category}</div>
                                <div className="flex flex-wrap gap-1">
                                  {emojis.map(emoji => (
                                    <button key={emoji} onClick={() => setEventForm({ ...eventForm, emoji })}
                                      className={`text-lg p-1.5 rounded-lg hover:bg-gray-100 transition-all ${eventForm.emoji === emoji ? 'ring-2 shadow-md' : ''}`}
                                      style={eventForm.emoji === emoji ? { outline: `2px solid ${accentColor}` } : {}}>
                                      {emoji}
                                    </button>
                                  ))}
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-bold mb-1.5" style={{ color: accentColor }}>Title</label>
                          <input type="text" value={eventForm.title} onChange={(e) => setEventForm({ ...eventForm, title: e.target.value })}
                            className="w-full p-2 text-sm border-2 rounded-lg" placeholder="Event title" />
                        </div>

                        <div className="flex items-center gap-2">
                          <input type="checkbox" checked={eventForm.allDay} onChange={(e) => setEventForm({ ...eventForm, allDay: e.target.checked })}
                            className="w-4 h-4 rounded" />
                          <label className="text-sm font-semibold">All-day event</label>
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="block text-xs font-bold mb-1.5" style={{ color: accentColor }}>Date</label>
                            <input type="date" value={eventForm.date} onChange={(e) => setEventForm({ ...eventForm, date: e.target.value })}
                              className="w-full p-2 text-sm border-2 rounded-lg" />
                          </div>
                          {!eventForm.allDay && (
                            <div>
                              <label className="block text-xs font-bold mb-1.5" style={{ color: accentColor }}>Time</label>
                              <input type="time" value={eventForm.time} onChange={(e) => setEventForm({ ...eventForm, time: e.target.value })}
                                className="w-full p-2 text-sm border-2 rounded-lg" />
                            </div>
                          )}
                        </div>

                        {!eventForm.allDay && (
                          <div>
                            <label className="block text-xs font-bold mb-1.5" style={{ color: accentColor }}>Duration (minutes)</label>
                            <input type="number" value={eventForm.duration} onChange={(e) => setEventForm({ ...eventForm, duration: parseInt(e.target.value) })}
                              className="w-full p-2 text-sm border-2 rounded-lg" min="15" step="15" />
                          </div>
                        )}

                        <div>
                          <label className="block text-xs font-bold mb-1.5" style={{ color: accentColor }}>Notes</label>
                          <textarea value={eventForm.notes} onChange={(e) => setEventForm({ ...eventForm, notes: e.target.value })}
                            className="w-full p-2 text-sm border-2 rounded-lg" rows="2" placeholder="Add notes..." />
                        </div>

                        <div>
                          <label className="block text-xs font-bold mb-1.5" style={{ color: accentColor }}>Alert me (minutes before)</label>
                          <select value={eventForm.alertMinutes} onChange={(e) => setEventForm({ ...eventForm, alertMinutes: parseInt(e.target.value) })}
                            className="w-full p-2 text-sm border-2 rounded-lg">
                            <option value="0">No alert</option>
                            <option value="5">5 minutes</option>
                            <option value="15">15 minutes</option>
                            <option value="30">30 minutes</option>
                            <option value="60">1 hour</option>
                            <option value="120">2 hours</option>
                            <option value="1440">1 day</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-xs font-bold mb-1.5" style={{ color: accentColor }}>Repeat</label>
                          <select value={eventForm.repeat} onChange={(e) => setEventForm({ ...eventForm, repeat: e.target.value })}
                            className="w-full p-2 text-sm border-2 rounded-lg mb-2">
                            <option value="none">No repeat</option>
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="biweekly">Bi-weekly</option>
                            <option value="monthly">Monthly</option>
                          </select>
                          {eventForm.repeat !== 'none' && (
                            <div>
                              <label className="block text-xs font-bold mb-1.5" style={{ color: accentColor }}>Repeat until</label>
                              <input type="date" value={eventForm.repeatUntil} onChange={(e) => setEventForm({ ...eventForm, repeatUntil: e.target.value })}
                                className="w-full p-2 text-sm border-2 rounded-lg" />
                            </div>
                          )}
                        </div>
                      </div>
                    </div>

                    <div className="flex gap-2 pt-3 border-t border-gray-100 mt-3">
                      <button onClick={handleAddEvent}
                        className="flex-1 py-2 text-sm rounded-lg text-white font-bold hover:shadow-xl transition-all"
                        style={{ background: `linear-gradient(135deg, ${accentColor} 0%, ${accentColor}dd 100%)` }}
                        disabled={!eventForm.title || !eventForm.date || (!eventForm.allDay && !eventForm.time)}>
                        {editingEvent ? 'Update Event' : 'Add Event'}
                      </button>
                      {editingEvent && (
                        <button onClick={() => handleDeleteEvent(editingEvent.id)}
                          className="px-5 py-2 text-sm rounded-lg text-white font-bold hover:shadow-xl transition-all"
                          style={{ background: 'linear-gradient(135deg, #E74C3C 0%, #C0392B 100%)' }}>
                          Delete
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {showCategoriesModal && (
                <div className="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-40 p-4" style={{ backdropFilter: 'blur(4px)' }}>
                  <div className="bg-white rounded-xl p-4 max-w-sm w-full shadow-2xl">
                    <div className="flex justify-between items-center mb-4">
                      <h2 className="text-lg font-bold" style={{ color: accentColor }}>Categories</h2>
                      <button onClick={() => setShowCategoriesModal(false)} className="text-gray-400 hover:text-gray-600">
                        <X size={18} />
                      </button>
                    </div>
                    <div className="space-y-2">
                      {categories.map(cat => (
                        <div key={cat.id} className="flex items-center gap-2 p-2 rounded-lg hover:bg-gray-50 cursor-pointer transition-all"
                          onClick={() => toggleCategory(cat.id)}>
                          <input type="checkbox" checked={cat.visible} onChange={() => toggleCategory(cat.id)} className="w-4 h-4 rounded" />
                          <div className="w-8 h-8 rounded-full flex items-center justify-center text-base" style={{ backgroundColor: cat.color + '25' }}>{cat.emoji}</div>
                          <div className="flex-1"><div className="font-bold text-xs">{cat.name}</div></div>
                          <div className="w-3 h-3 rounded-full" style={{ backgroundColor: cat.color }} />
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {showSettingsModal && (
                <div className="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-40 p-4" style={{ backdropFilter: 'blur(4px)' }}>
                  <div className="bg-white rounded-xl p-5 max-w-md w-full shadow-2xl max-h-[85vh] overflow-y-auto">
                    <div className="flex justify-between items-center mb-4">
                      <h2 className="text-xl font-bold" style={{ color: accentColor }}>Settings</h2>
                      <button onClick={() => setShowSettingsModal(false)} className="text-gray-400 hover:text-gray-600">
                        <X size={20} />
                      </button>
                    </div>
                    <div className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold mb-2" style={{ color: accentColor }}>Color Mode</label>
                        <div className="flex gap-2 mb-3">
                          <button onClick={() => setColorMode('pastel')}
                            className={`flex-1 py-2 text-sm rounded-lg font-bold transition-all ${colorMode === 'pastel' ? 'text-white shadow-lg' : 'bg-gray-100'}`}
                            style={colorMode === 'pastel' ? { background: 'linear-gradient(135deg, #FFB6C1 0%, #E6B5E8 100%)' } : {}}>
                            Soft & Pastel
                          </button>
                          <button onClick={() => setColorMode('vibrant')}
                            className={`flex-1 py-2 text-sm rounded-lg font-bold transition-all ${colorMode === 'vibrant' ? 'text-white shadow-lg' : 'bg-gray-100'}`}
                            style={colorMode === 'vibrant' ? { background: 'linear-gradient(135deg, #FF1493 0%, #9B59B6 100%)' } : {}}>
                            Bright & Fun
                          </button>
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs font-bold mb-2" style={{ color: accentColor }}>Theme Color</label>
                        <div className="grid grid-cols-3 gap-2">
                          {colorThemes[colorMode].map(preset => (
                            <button key={preset.value} onClick={() => setAccentColor(preset.value)}
                              className={`p-3 rounded-lg border-2 transition-all ${accentColor === preset.value ? 'border-gray-800 shadow-lg' : 'border-gray-200'}`}
                              style={{ backgroundColor: preset.value }}>
                              <div className="text-xs text-white font-bold drop-shadow-lg">{preset.name}</div>
                            </button>
                          ))}
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs font-bold mb-2" style={{ color: accentColor }}>Background Wallpaper</label>
                        <div className="grid grid-cols-4 gap-2">
                          <button onClick={() => setWallpaper({ ...wallpaper, pattern: 'none' })}
                            className={`p-3 rounded-lg border-2 transition-all ${wallpaper.pattern === 'none' ? 'border-gray-800 shadow-lg' : 'border-gray-200'} bg-white`}>
                            <div className="text-xs font-bold">None</div>
                          </button>
                          <button onClick={() => setWallpaper({ ...wallpaper, pattern: 'polkadots' })}
                            className={`p-3 rounded-lg border-2 transition-all ${wallpaper.pattern === 'polkadots' ? 'border-gray-800 shadow-lg' : 'border-gray-200'}`}
                            style={{ backgroundImage: `radial-gradient(circle, ${wallpaper.color}40 1.5px, transparent 1.5px)`, backgroundSize: '15px 15px' }}>
                            <div className="text-xs font-bold">Dots</div>
                          </button>
                          <button onClick={() => setWallpaper({ ...wallpaper, pattern: 'stripes' })}
                            className={`p-3 rounded-lg border-2 transition-all ${wallpaper.pattern === 'stripes' ? 'border-gray-800 shadow-lg' : 'border-gray-200'}`}
                            style={{ backgroundImage: `repeating-linear-gradient(45deg, ${wallpaper.color}20, ${wallpaper.color}20 8px, transparent 8px, transparent 16px)` }}>
                            <div className="text-xs font-bold">Stripes</div>
                          </button>
                          <button onClick={() => setWallpaper({ ...wallpaper, pattern: 'hearts' })}
                            className={`p-3 rounded-lg border-2 transition-all ${wallpaper.pattern === 'hearts' ? 'border-gray-800 shadow-lg' : 'border-gray-200'}`}>
                            <div className="text-xs font-bold">Hearts</div>
                          </button>
                        </div>
                        {wallpaper.pattern !== 'none' && (
                          <div className="mt-3">
                            <label className="block text-xs font-bold mb-2" style={{ color: accentColor }}>Pattern Color</label>
                            <div className="grid grid-cols-6 gap-2">
                              {colorThemes[colorMode].map(preset => (
                                <button key={preset.value} onClick={() => setWallpaper({ ...wallpaper, color: preset.value })}
                                  className={`w-10 h-10 rounded-full border-2 ${wallpaper.color === preset.value ? 'border-gray-800 scale-110' : 'border-gray-200'} transition-all`}
                                  style={{ backgroundColor: preset.value }} />
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StudentCalendar />);
    </script>
</body>
</html>
